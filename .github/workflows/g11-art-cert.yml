name: G11 Painterly Modular World Cert
on:
  push:
    branches: [lab/g11-painterly-world]
    paths:
      - 'lab/senda-premium/**'
      - '.github/workflows/g11-art-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g11:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab/senda-premium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify art provenance and budget
        run: npm run test:g11:art
      - name: Preserve original economy and collection
        run: npm run test:g5:core && npm run test:g6:core
      - name: Build G5-G11
        run: npm run build
      - name: Verify PixiJS WebGL and gameplay in real browser
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g11-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/g11.html > /dev/null; then break; fi
            sleep 1
          done
          xvfb-run -a npm run test:g11:pixi
      - name: Retain visual evidence for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-painterly-modular-evidence
          retention-days: 7
          path: |
            lab/senda-premium/G11_*.png
            lab/senda-premium/G11_RUNTIME_CERT.json
          if-no-files-found: ignore
      - name: Diagnostic on failure
        if: failure()
        run: cat /tmp/g11-preview.log || true
