name: G5 Premium Pixi Runtime Cert
on:
  push:
    branches:
      - lab/g5-pixi-premium
    paths:
      - 'lab/senda-premium/**'
      - '.github/workflows/g5-pixi-runtime-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g5-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab/senda-premium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Validate core
        run: npm run test:g5:core
      - name: Build both preserved lab and G5
        run: npm run build
      - name: Browser cert requires actual Pixi + WebGL
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g5-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/g5.html >/dev/null; then break; fi
            sleep 1
          done
          PW_HEADED=1 xvfb-run -a npm run test:g5:pixi
      - name: Capture visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g5-pixi-runtime-evidence
          path: |
            lab/senda-premium/G5_PIXI_*.png
            lab/senda-premium/G5_PIXI_RUNTIME_CERT.json
          if-no-files-found: ignore
      - name: Print server log on failure
        if: failure()
        run: cat /tmp/g5-preview.log || true
