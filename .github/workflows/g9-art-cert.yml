name: G9 Modular Art Pixi Runtime Cert
on:
  push:
    branches: [lab/g9-art-production]
    paths:
      - 'lab/senda-premium/**'
      - '.github/workflows/g9-art-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g9:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab/senda-premium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages already in use
        run: npm install --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Preserve old gameplay
        run: npm run test:g5:core && npm run test:g6:core
      - name: Build G5-G9
        run: npm run build
      - name: Certify WebGL art and economy
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g9-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/g9.html >/dev/null; then break; fi
            sleep 1
          done
          xvfb-run -a npm run test:g9:pixi
      - name: Evidence with limited retention
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g9-modular-art-evidence
          retention-days: 7
          path: |
            lab/senda-premium/G9_*.png
            lab/senda-premium/G9_ART_RUNTIME_CERT.json
          if-no-files-found: ignore
      - name: Diagnostics on failure
        if: failure()
        run: cat /tmp/g9-preview.log || true
