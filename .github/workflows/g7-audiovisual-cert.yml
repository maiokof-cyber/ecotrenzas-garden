name: G7 Audiovisual and Pixi Cert
on:
  push:
    branches:
      - lab/g7-audiovisual
    paths:
      - 'lab/senda-premium/**'
      - '.github/workflows/g7-audiovisual-cert.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g7:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab/senda-premium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Preserve G5 and G6 gameplay contracts
        run: npm run test:g5:core && npm run test:g6:core
      - name: Build G5, G6 and G7 separately
        run: npm run build
      - name: Chromium audiovisual acceptance on true Pixi WebGL
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/g7-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/g7.html >/dev/null; then break; fi
            sleep 1
          done
          xvfb-run -a npm run test:g7:pixi
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g7-audiovisual-evidence
          path: |
            lab/senda-premium/G7_*.png
            lab/senda-premium/G7_AUDIOVISUAL_RUNTIME_CERT.json
          if-no-files-found: ignore
      - name: Server diagnostic on failure
        if: failure()
        run: cat /tmp/g7-preview.log || true
