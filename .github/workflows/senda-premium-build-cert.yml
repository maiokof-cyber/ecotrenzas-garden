name: Premium Senda Build Cert

on:
  push:
    branches:
      - lab/senda-premium-v1
    paths:
      - 'lab/senda-premium/**'
      - '.github/workflows/senda-premium-build-cert.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: lab/senda-premium
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lab/senda-premium/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Verify output
        run: |
          test -f dist/index.html
          test -d dist/assets
          echo "BUILD_CERT_OK"
